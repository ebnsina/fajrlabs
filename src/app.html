<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Applies the saved theme before first paint so the page never flashes.
			try {
				const saved = localStorage.getItem('fajrlabs:theme');
				const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		<script>
			// Decide up front whether this visitor gets motion, and guarantee that a
			// failed or slow script can never leave content invisible.
			try {
				var c = navigator.connection || {};
				var slow = c.saveData || /(^|-)2g$/.test(c.effectiveType || '');
				if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !slow) {
					document.documentElement.classList.add('motion');
					setTimeout(function () {
						document.documentElement.classList.remove('motion');
					}, 1200);
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
